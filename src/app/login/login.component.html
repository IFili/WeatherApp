<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login and Registration</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css">
  
</head>


<body >
  <div class="container">
    <!-- Pills navs -->
    <ul class="nav nav-pills nav-justified mb-3" id="ex1" role="tablist">
      <li class="nav-item" role="presentation">
        <a class="nav-link active" id="tab-login" data-bs-toggle="pill" href="#pills-login" role="tab"
          aria-controls="pills-login" aria-selected="true">Login</a>
      </li>
      <li class="nav-item" role="presentation">
        <a class="nav-link" id="tab-register" data-bs-toggle="pill" href="#pills-register" role="tab"
          aria-controls="pills-register" aria-selected="false">Register</a>
      </li>
    </ul>
    <!-- Pills navs -->

    <!-- Pills content -->
    <div class="tab-content">
      <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="tab-login">
       <form [formGroup]="loginForm" class="mb-4" autocomplete="off" (ngSubmit)="onSubmit()">
          <div class="input">
            <label>Email (username)</label>
            <input  type="text" class="form-control" formControlName="email" name="email">

          </div>
        
          <div class="input">
            <label>Password</label>
            <input  type="password" class="form-control" formControlName="password" name="password">
          </div>
        
          <button type="submit"  class="btn btn-primary">Login</button>
        </form>
      </div>
      <div class="tab-pane fade" id="pills-register" role="tabpanel" aria-labelledby="tab-register">
        <form [formGroup]="signUpForm" (ngSubmit)="onSignup()">
          <div class="input">
            <label>First Name</label>
            <input type="text" class="form-control" formControlName="firstName">
          </div>
        
          <div class="input">
            <label>Last Name</label>
            <input type="text" class="form-control" formControlName="lastName">
          </div>
        
          <div class="input">
            <label>Email (Username)</label>
            <input type="text" class="form-control" formControlName="username">
          </div>
        
          <div class="input">
            <label>Password</label>
            <input type="password" class="form-control" formControlName="password">
          </div>
        
          <button type="submit" class="btn btn-primary">Register</button>
        </form>
      </div>
    </div>
    <!-- Pills content -->
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>
 
</body>

</html>
